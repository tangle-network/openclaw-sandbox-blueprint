[workspace]
resolver = "3"
members = [
    "openclaw-sandbox-blueprint-lib",
    "openclaw-sandbox-blueprint-bin",
    "openclaw-tee-sandbox-blueprint-lib",
    "openclaw-tee-sandbox-blueprint-bin",
]

[workspace.package]
authors = ["Drew Stone"]
edition = "2024"
description = "OpenClaw Sandbox Blueprint for Tangle Network"
license = "MIT OR Apache-2.0"

# Reduce debug build sizes (~60-70% smaller binaries)
[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = 1

[patch.crates-io]
# Keep the libp2p 0.56 API while moving DNS resolution to hickory 0.26.
libp2p-dns = { path = "vendor/libp2p-dns" }
# Keep the libp2p 0.56 API while moving mDNS off vulnerable hickory-proto 0.25.
libp2p-mdns = { path = "vendor/libp2p-mdns" }
# Keep the tokio-tar API while using the maintained astral-tokio-tar implementation.
tokio-tar = { path = "vendor/tokio-tar" }
# Keep the libp2p 0.56 API while removing its vulnerable yamux 0.12 compatibility path.
libp2p-yamux = { path = "vendor/libp2p-yamux" }

# Use local blueprint SDK checkout for development/testing.
# Remove this section before publishing or when the upstream crates are published.
[patch."https://github.com/tangle-network/blueprint.git"]
blueprint-sdk = { version = "=0.2.0-alpha.6" }
blueprint-producers-extra = { path = "../blueprint/crates/producers-extra" }
